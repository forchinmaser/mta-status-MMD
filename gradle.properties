org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Kotlin Android plugin registers a build-event listener the configuration
# cache cannot serialise. Gradle 9 enables that cache by default, so keep it off.
# Also: the wrapper is pinned to Gradle 8.7 — AGP 8.5.2 does not support Gradle 9.
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true
